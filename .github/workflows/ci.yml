name: CI

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMR "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            '*.js' '*.jsx' '*.ts' '*.tsx' '*.css' '*.scss' '*.json' '*.md' '*.html' '*.yml' '*.yaml' |
          xargs -0 -r npx prettier --check

      - name: Build
        run: npm run build
